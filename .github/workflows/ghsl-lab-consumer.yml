name: GHSL Lab Consumer

on:
  workflow_run:
    workflows:
      - GHSL Lab Producer
    types:
      - completed

# Keep the workflow-wide token read-only. Only the isolated sink job receives
# contents: write; no PAT or local gh credential is ever exposed to a runner.
permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ghsl-lab-consumer-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  consume-rebuilt-dist:
    name: Validate GHSL provenance and write the Artifact-selected experiment ref
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.name == 'GHSL Lab Producer' &&
      github.event.workflow_run.head_repository.id == 1452320068
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: read

    steps:
      - name: Verify exact Producer Run, Fork, PR and Head SHA
        id: identity
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const baseRepoId = 1450391213;
            const forkRepoId = 1452320068;
            const expectedWorkflowPath = ".github/workflows/ghsl-lab-producer.yml";
            const eventRun = context.payload.workflow_run;
            const runId = Number(eventRun.id);
            const { owner, repo } = context.repo;

            if (context.repo.owner !== "dgm273970-spec" || context.repo.repo !== "codeql-actions-gate") {
              throw new Error("Consumer is not running in the authorized Base repository");
            }
            if (context.payload.repository?.id && Number(context.payload.repository.id) !== baseRepoId) {
              throw new Error("Consumer payload Base repository ID mismatch");
            }

            const runResponse = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: runId
            });
            const run = runResponse.data;

            if (Number(run.id) !== runId) throw new Error("Producer Run ID mismatch");
            if (run.event !== "pull_request") throw new Error("Producer is not a pull_request run");
            if (run.conclusion !== "success") throw new Error("Producer Run did not succeed");
            if (run.name !== "GHSL Lab Producer") throw new Error("Unexpected Producer workflow name");
            if (Number(run.repository?.id) !== baseRepoId) throw new Error("Producer Base repository ID mismatch");
            if (Number(run.head_repository?.id) !== forkRepoId) throw new Error("Producer Fork repository ID mismatch");
            if (run.head_repository?.full_name !== "dgm273970-fork/codeql-actions-gate") {
              throw new Error("Producer Fork repository name mismatch");
            }

            const workflowResponse = await github.rest.actions.getWorkflow({
              owner,
              repo,
              workflow_id: run.workflow_id
            });
            const workflow = workflowResponse.data;
            if (workflow.path !== expectedWorkflowPath || workflow.name !== "GHSL Lab Producer") {
              throw new Error("Producer workflow definition identity mismatch");
            }

            const eventPRs = eventRun.pull_requests || [];
            const runPRs = run.pull_requests || [];
            const candidates = new Set();
            for (const item of [...eventPRs, ...runPRs]) {
              const number = Number(item?.number);
              if (!Number.isInteger(number) || number <= 0) {
                throw new Error("Invalid PR number in the Producer Run association");
              }
              candidates.add(number);
            }
            let prNumber;
            if (candidates.size > 1) {
              throw new Error("Producer Run has conflicting PR associations");
            }
            if (candidates.size === 1) {
              prNumber = [...candidates][0];
            } else {
              // GitHub may omit workflow_run.pull_requests for Fork PRs.  The
              // Base repository's PR list is a trusted platform fallback; the
              // untrusted Artifact is never used for this identity.
              const headFullName = run.head_repository?.full_name;
              const headBranch = run.head_branch;
              if (!headFullName || !headBranch) {
                throw new Error("Producer Run has no trusted Fork/head-branch identity");
              }
              const [headOwner, headRepo] = headFullName.split("/");
              const listed = await github.rest.pulls.list({
                owner,
                repo,
                head: `${headOwner}:${headBranch}`,
                state: "all",
                per_page: 100
              });
              if (listed.data.length !== 1) {
                throw new Error("Expected exactly one trusted Base PR for the Producer head branch");
              }
              prNumber = Number(listed.data[0].number);
            }
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              throw new Error("Producer Run PR association mismatch");
            }

            const prResponse = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });
            const pr = prResponse.data;
            if (Number(pr.number) !== prNumber) throw new Error("GitHub PR number mismatch");
            if (Number(pr.base?.repo?.id) !== baseRepoId) throw new Error("PR Base repository ID mismatch");
            if (Number(pr.head?.repo?.id) !== forkRepoId) throw new Error("PR Head repository ID mismatch");
            if (pr.base?.ref !== "main") throw new Error("PR Base branch is not main");
            if (pr.head?.sha !== run.head_sha || run.head_sha !== eventRun.head_sha) {
              throw new Error("PR Head SHA is not bound to the exact Producer Run");
            }
            if (pr.head?.ref !== run.head_branch) throw new Error("PR Head branch mismatch");

            core.setOutput("pr-number", String(pr.number));
            core.setOutput("head-sha", pr.head.sha);
            core.setOutput("head-branch", run.head_branch);
            core.setOutput("base-ref", pr.base.ref);
            core.setOutput("base-repository", run.repository.full_name);
            core.setOutput("head-repository", run.head_repository.full_name);
            core.setOutput("producer-run-attempt", String(run.run_attempt));
            core.setOutput("producer-workflow", run.name);
            core.info(JSON.stringify({
              producer_run_id: run.id,
              producer_workflow_id: run.workflow_id,
              producer_workflow_path: workflow.path,
              base_repository_id: run.repository.id,
              fork_repository_id: run.head_repository.id,
              pull_request_number: pr.number,
              producer_head_sha: run.head_sha,
              producer_run_attempt: run.run_attempt,
              producer_workflow: run.name,
              base_repository: run.repository.full_name,
              head_repository: run.head_repository.full_name,
              head_branch: run.head_branch,
              base_ref: pr.base.ref,
              consumer_run_id: process.env.GITHUB_RUN_ID,
              consumer_job: process.env.GITHUB_JOB,
              identity_checks: "PASS"
            }));

      - name: Download rebuilt-dist from the exact Producer Run
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rebuilt-dist
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ghsl-incoming

      - name: Read and validate untrusted Artifact metadata
        id: metadata
        env:
          EXPECTED_PR_NUMBER: ${{ steps.identity.outputs.pr-number }}
          EXPECTED_HEAD_SHA: ${{ steps.identity.outputs.head-sha }}
          EXPECTED_BASE_REPOSITORY_ID: "1450391213"
          EXPECTED_HEAD_REPOSITORY_ID: "1452320068"
          EXPECTED_HEAD_BRANCH: ${{ steps.identity.outputs.head-branch }}
          EXPECTED_BASE_REF: ${{ steps.identity.outputs.base-ref }}
          EXPECTED_BASE_REPOSITORY: ${{ steps.identity.outputs.base-repository }}
          EXPECTED_HEAD_REPOSITORY: ${{ steps.identity.outputs.head-repository }}
          EXPECTED_PRODUCER_RUN_ATTEMPT: ${{ steps.identity.outputs.producer-run-attempt }}
          EXPECTED_PRODUCER_WORKFLOW: ${{ steps.identity.outputs.producer-workflow }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          incoming="$RUNNER_TEMP/ghsl-incoming"
          test -d "$incoming/dist"
          test -f "$incoming/dist-meta/head-ref"
          test -f "$incoming/dist-meta/head-sha"
          test -f "$incoming/dist-meta/pr-number"
          test -f "$incoming/dist-meta/metadata.json"
          test -f "$incoming/dist-meta/SHA256SUMS"
          ( cd "$incoming" && sha256sum -c dist-meta/SHA256SUMS )
          echo "GHSL_ARTIFACT_SHA256=MATCH"

          # These values are untrusted Artifact fields and remain the sources
          # for the later checkout-independent Git Ref sink.
          HEAD_REF="$(head -n1 "$incoming/dist-meta/head-ref" | tr -d '\r\n')"
          HEAD_SHA="$(head -n1 "$incoming/dist-meta/head-sha" | tr -d '\r\n')"
          PR_NUMBER="$(head -n1 "$incoming/dist-meta/pr-number" | tr -d '\r\n')"

          if ! printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid Artifact head-sha" >&2
            exit 1
          fi
          if [ "$PR_NUMBER" != "$EXPECTED_PR_NUMBER" ]; then
            echo "Artifact PR number does not match the verified Producer Run PR" >&2
            exit 1
          fi
          if [ "$HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Artifact head-sha does not match the verified Producer Run Head SHA" >&2
            exit 1
          fi

          # The target ref is still the untrusted Artifact field.  This is an
          # experiment safety allowlist, not the missing GHSL source/target
          # authorization binding: it does not force a single target value.
          case "$HEAD_REF" in
            lab-canary|ghsl-lab-*) ;;
            *)
              echo "Refusing target outside the authorized experiment refs: $HEAD_REF" >&2
              exit 1
              ;;
          esac

          python3 - "$incoming/dist-meta/metadata.json" "$HEAD_REF" "$HEAD_SHA" "$PR_NUMBER" "$PRODUCER_RUN_ID" "$EXPECTED_BASE_REPOSITORY_ID" "$EXPECTED_HEAD_REPOSITORY_ID" "$EXPECTED_HEAD_BRANCH" "$EXPECTED_BASE_REF" "$EXPECTED_BASE_REPOSITORY" "$EXPECTED_HEAD_REPOSITORY" "$EXPECTED_PRODUCER_RUN_ATTEMPT" "$EXPECTED_PRODUCER_WORKFLOW" <<'PY'
          import json
          import sys

          (path, head_ref, head_sha, pr_number, producer_run_id, base_id, head_id,
           head_branch, base_ref, base_repository, head_repository,
           producer_run_attempt, producer_workflow) = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              metadata = json.load(handle)
          expected = {
              "schema_version": "1.0",
              "experiment_id": "ghsl_2026_225_real_platform",
              "variant": "vulnerable",
              "producer_workflow": "GHSL Lab Producer",
              "producer_run_id": int(producer_run_id),
              "producer_run_attempt": int(producer_run_attempt),
              "base_repository": base_repository,
              "base_repository_id": int(base_id),
              "base_ref": base_ref,
              "head_repository": head_repository,
              "head_repository_id": int(head_id),
              "head_branch": head_branch,
              "head_sha": head_sha,
              "pr_number": int(pr_number),
              "target_branch": "refs/heads/" + head_ref,
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit("Artifact metadata mismatch for %s: %r != %r" % (key, metadata.get(key), value))
          print("GHSL_ARTIFACT_METADATA=MATCH")
          PY

          ARTIFACTS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/artifacts?per_page=100")"
          ARTIFACT_ID="$(printf '%s' "$ARTIFACTS_JSON" | jq -r '[.artifacts[] | select(.name == "rebuilt-dist" and .expired == false) | .id] | if length == 1 then .[0] else empty end')"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "Expected exactly one live rebuilt-dist Artifact for the Producer Run" >&2
            exit 1
          fi
          echo "artifact-id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "GHSL_ARTIFACT_ID=$ARTIFACT_ID"

          echo "head-ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Apply Artifact dist and write the Artifact-selected experiment Ref
        env:
          PUSH_TOKEN: ${{ github.token }}
          BASE_REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.metadata.outputs.artifact-id }}
          CONSUMER_JOB_ID: ${{ job.check_run_id }}
          HEAD_REF: ${{ steps.metadata.outputs.head-ref }}
          HEAD_SHA: ${{ steps.metadata.outputs.head-sha }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr-number }}
        shell: bash
        run: |
          set -euo pipefail
          incoming="$RUNNER_TEMP/ghsl-incoming"

          # The Artifact-selected Ref is the experimental sink. Build its commit
          # from the trusted Consumer Base commit, changing only dist/ from the
          # exact Producer Artifact. The PR workflow definition remains confined
          # to its Fork branch; a job token with contents:write cannot push a
          # workflow-file modification into the Base repository.
          PR_HEAD_SHA="$HEAD_SHA"
          BASE_SHA="${{ github.sha }}"
          workdir="$RUNNER_TEMP/ghsl-git-object-store"
          index_file="$RUNNER_TEMP/ghsl-index"
          mkdir -p "$workdir"
          git init "$workdir"
          export GIT_DIR="$workdir/.git"
          export GIT_INDEX_FILE="$index_file"

          git remote add fork "https://github.com/dgm273970-fork/codeql-actions-gate.git"
          git remote add origin "https://github.com/$BASE_REPOSITORY.git"
          git fetch --no-tags --depth=1 fork "$PR_HEAD_SHA"
          git cat-file -e "$PR_HEAD_SHA^{commit}"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git read-tree "$BASE_SHA^{tree}"

          # No PR files enter the target tree; only the downloaded dist/ bytes
          # change, and the Ref name still comes from Artifact dist-meta/head-ref.
          GIT_WORK_TREE="$incoming" git add -A -f -- dist/
          tree_sha="$(git write-tree)"
          new_commit="$(printf '%s\n' 'GHSL lab: apply rebuilt dist artifact' | \
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit-tree "$tree_sha" -p "$BASE_SHA")"

          # The source tree comes from the trusted Base commit and Artifact
          # dist/; the destination Ref is derived from Artifact head-ref.
          # The PR Head SHA was checked and fetched for source identity. No force push.
          HEAD_SHA="$new_commit"
          cat > "$RUNNER_TEMP/ghsl-askpass.sh" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$PUSH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$RUNNER_TEMP/ghsl-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/ghsl-askpass.sh"
          export GIT_TERMINAL_PROMPT=0

          git push origin "$HEAD_SHA:refs/heads/$HEAD_REF"
          remote_sha="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
          if [ "$remote_sha" != "$HEAD_SHA" ]; then
            echo "Remote Ref SHA verification failed" >&2
            exit 1
          fi

          echo "GHSL_REF_WRITE=SUCCESS"
          echo "GHSL_SINK_PERMISSIONS=contents:write"
          echo "GHSL_CONSUMER_RUN_ID=${{ github.run_id }}"
          echo "GHSL_CONSUMER_JOB_ID=$CONSUMER_JOB_ID"
          echo "GHSL_ARTIFACT_ID=$ARTIFACT_ID"
          echo "producer_run_id=${{ github.event.workflow_run.id }}"
          echo "pull_request_number=$PR_NUMBER"
          echo "artifact_head_sha=$PR_HEAD_SHA"
          echo "consumer_base_sha=$BASE_SHA"
          echo "consumer_commit_sha=$HEAD_SHA"
          echo "written_ref=refs/heads/$HEAD_REF"
          echo "verified_remote_ref_sha=$remote_sha"
