name: GHSL Lab Consumer Allow

# Guide Phase 7 item 8 — legitimate-authorization positive control.
#
# The fixed path (§9.2) shows a Fork PR is refused because the Same-Repository
# PR Branch Write-Back Policy gives it an empty authorized set.  Item 8 requires
# the other side of that policy to be executed for real, otherwise "everything
# is rejected" could be passed off as a correct fix:
#
#   repo_head == repo_base  ->  authorized set = { (repo_base, refs/heads/<PR head ref>) }
#
# Identity binding, exact-run-id download and SHA256 verification are the same
# as in the fixed consumer.  The only difference is the policy instance: here a
# matching authorized target must reach the Sink and the platform write must be
# accepted.  The workflow-wide token stays read-only; only `write-back` gets
# contents: write, and no checked-out PR file is ever executed.
on:
  workflow_run:
    workflows:
      - GHSL Lab Producer Allow
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ghsl-lab-consumer-allow-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  bind:
    name: Bind the exact Producer Run, Artifact and trusted PR identity
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.name == 'GHSL Lab Producer Allow' &&
      github.event.workflow_run.repository.id == 1450391213 &&
      github.event.workflow_run.head_repository.id == 1450391213
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      decision: ${{ steps.policy.outputs.decision }}
      reason: ${{ steps.policy.outputs.reason }}
      target-branch: ${{ steps.metadata.outputs.head-ref }}
      head-sha: ${{ steps.identity.outputs.head-sha }}
      pr-number: ${{ steps.identity.outputs.pr-number }}
      artifact-id: ${{ steps.metadata.outputs.artifact-id }}
    steps:
      - name: Verify exact Producer Run, same-repository PR and Head SHA
        id: identity
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const baseRepoId = 1450391213;
            const expectedWorkflowPath = ".github/workflows/ghsl-lab-producer-allow.yml";
            const eventRun = context.payload.workflow_run;
            const runId = Number(eventRun.id);
            const { owner, repo } = context.repo;

            if (context.repo.owner !== "dgm273970-spec" || context.repo.repo !== "codeql-actions-gate") {
              throw new Error("Consumer is not running in the authorized Base repository");
            }
            if (context.payload.repository?.id && Number(context.payload.repository.id) !== baseRepoId) {
              throw new Error("Consumer payload Base repository ID mismatch");
            }

            const runResponse = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            const run = runResponse.data;

            const checks = [];
            const check = (name, ok, detail) => {
              checks.push({ check: name, result: ok ? "MATCH" : "MISMATCH", detail: String(detail ?? "") });
              return ok;
            };

            if (!check("producer_run_id_equal", Number(run.id) === runId, run.id)) {
              throw new Error("Producer Run ID mismatch");
            }
            if (!check("producer_event", run.event === "pull_request", run.event)) {
              throw new Error("Producer is not a pull_request run");
            }
            if (!check("producer_conclusion", run.conclusion === "success", run.conclusion)) {
              throw new Error("Producer Run did not succeed");
            }
            if (!check("producer_name", run.name === "GHSL Lab Producer Allow", run.name)) {
              throw new Error("Unexpected Producer workflow name");
            }
            if (!check("producer_base_repository_id", Number(run.repository?.id) === baseRepoId,
                         run.repository?.id)) {
              throw new Error("Producer Base repository ID mismatch");
            }
            if (!check("producer_is_same_repository", Number(run.head_repository?.id) === baseRepoId,
                         run.head_repository?.id)) {
              throw new Error("ALLOW control requires a same-repository PR (head repo id == base repo id)");
            }
            if (!check("producer_head_repository_name",
                         run.head_repository?.full_name === "dgm273970-spec/codeql-actions-gate",
                         run.head_repository?.full_name)) {
              throw new Error("Producer Head repository name mismatch");
            }

            const workflowResponse = await github.rest.actions.getWorkflow({
              owner, repo, workflow_id: run.workflow_id
            });
            const workflow = workflowResponse.data;
            if (!check("producer_workflow_definition",
                         workflow.path === expectedWorkflowPath &&
                         workflow.name === "GHSL Lab Producer Allow", workflow.path)) {
              throw new Error("Producer workflow definition identity mismatch");
            }

            const candidates = new Set();
            for (const item of [...(eventRun.pull_requests || []), ...(run.pull_requests || [])]) {
              const number = Number(item?.number);
              if (!Number.isInteger(number) || number <= 0) {
                throw new Error("Invalid PR number in the Producer Run association");
              }
              candidates.add(number);
            }
            let prNumber;
            if (candidates.size > 1) {
              throw new Error("Producer Run has conflicting PR associations");
            }
            if (candidates.size === 1) {
              prNumber = [...candidates][0];
            } else {
              // Trusted platform fallback (Base PR list), never the Artifact.
              const headFullName = run.head_repository?.full_name;
              const headBranch = run.head_branch;
              if (!headFullName || !headBranch) {
                throw new Error("Producer Run has no trusted head identity");
              }
              const listed = await github.rest.pulls.list({
                owner, repo, head: `${headFullName}:${headBranch}`, state: "all", per_page: 100
              });
              if (listed.data.length !== 1) {
                throw new Error("Expected exactly one trusted Base PR for the Producer head branch");
              }
              prNumber = Number(listed.data[0].number);
            }

            const prResponse = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const pr = prResponse.data;
            if (!check("pr_number", Number(pr.number) === prNumber, pr.number)) {
              throw new Error("GitHub PR number mismatch");
            }
            if (!check("pr_base_repository_id", Number(pr.base?.repo?.id) === baseRepoId,
                         pr.base?.repo?.id)) {
              throw new Error("PR Base repository ID mismatch");
            }
            if (!check("pr_head_is_base_repository", Number(pr.head?.repo?.id) === baseRepoId,
                         pr.head?.repo?.id)) {
              throw new Error("PR Head is not in the Base repository");
            }
            if (!check("pr_base_ref_main", pr.base?.ref === "main", pr.base?.ref)) {
              throw new Error("PR Base branch is not main");
            }
            if (!check("pr_head_sha_bound_to_run",
                         pr.head?.sha === run.head_sha && run.head_sha === eventRun.head_sha,
                         `${pr.head?.sha}/${run.head_sha}`)) {
              throw new Error("PR Head SHA is not bound to the exact Producer Run");
            }
            if (!check("pr_head_ref_bound_to_run", pr.head?.ref === run.head_branch, pr.head?.ref)) {
              throw new Error("PR Head branch mismatch");
            }
            if (!check("pr_head_ref_prefix",
                         String(pr.head?.ref || "").startsWith("ghsl-lab-allow-"), pr.head?.ref)) {
              throw new Error("ALLOW control head branch must use the ghsl-lab-allow- prefix");
            }

            core.setOutput("pr-number", String(pr.number));
            core.setOutput("head-sha", pr.head.sha);
            core.setOutput("head-branch", run.head_branch);
            core.setOutput("base-ref", pr.base.ref);
            core.setOutput("base-repository", run.repository.full_name);
            core.setOutput("head-repository", run.head_repository.full_name);
            core.setOutput("producer-run-attempt", String(run.run_attempt));
            core.setOutput("producer-workflow", run.name);
            core.setOutput("identity-checks", JSON.stringify(checks));
            core.info(JSON.stringify({
              producer_run_id: run.id,
              producer_workflow_id: run.workflow_id,
              producer_workflow_path: workflow.path,
              base_repository_id: run.repository.id,
              head_repository_id: run.head_repository.id,
              pull_request_number: pr.number,
              producer_head_sha: run.head_sha,
              producer_run_attempt: run.run_attempt,
              base_repository: run.repository.full_name,
              head_repository: run.head_repository.full_name,
              head_branch: run.head_branch,
              base_ref: pr.base.ref,
              consumer_run_id: process.env.GITHUB_RUN_ID,
              consumer_job: process.env.GITHUB_JOB,
              identity_checks: "PASS"
            }));

      - name: Download rebuilt-dist from the exact Producer Run
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rebuilt-dist
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ghsl-incoming

      - name: Read and validate untrusted Artifact metadata
        id: metadata
        env:
          EXPECTED_PR_NUMBER: ${{ steps.identity.outputs.pr-number }}
          EXPECTED_HEAD_SHA: ${{ steps.identity.outputs.head-sha }}
          EXPECTED_BASE_REPOSITORY_ID: "1450391213"
          EXPECTED_HEAD_REPOSITORY_ID: "1450391213"
          EXPECTED_HEAD_BRANCH: ${{ steps.identity.outputs.head-branch }}
          EXPECTED_BASE_REF: ${{ steps.identity.outputs.base-ref }}
          EXPECTED_BASE_REPOSITORY: ${{ steps.identity.outputs.base-repository }}
          EXPECTED_HEAD_REPOSITORY: ${{ steps.identity.outputs.head-repository }}
          EXPECTED_PRODUCER_RUN_ATTEMPT: ${{ steps.identity.outputs.producer-run-attempt }}
          EXPECTED_PRODUCER_WORKFLOW: ${{ steps.identity.outputs.producer-workflow }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          incoming="$RUNNER_TEMP/ghsl-incoming"
          test -d "$incoming/dist"
          test -f "$incoming/dist-meta/head-ref"
          test -f "$incoming/dist-meta/head-sha"
          test -f "$incoming/dist-meta/pr-number"
          test -f "$incoming/dist-meta/metadata.json"
          test -f "$incoming/dist-meta/SHA256SUMS"
          ( cd "$incoming" && sha256sum -c dist-meta/SHA256SUMS )
          echo "GHSL_ARTIFACT_SHA256=MATCH"

          # These values stay untrusted; they are the data-flow input to the
          # Sink and are only ever compared against the trusted identity above.
          HEAD_REF="$(head -n1 "$incoming/dist-meta/head-ref" | tr -d '\r\n')"
          HEAD_SHA="$(head -n1 "$incoming/dist-meta/head-sha" | tr -d '\r\n')"
          PR_NUMBER="$(head -n1 "$incoming/dist-meta/pr-number" | tr -d '\r\n')"

          if ! printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid Artifact head-sha" >&2
            exit 1
          fi
          if [ "$PR_NUMBER" != "$EXPECTED_PR_NUMBER" ]; then
            echo "Artifact PR number does not match the verified Producer Run PR" >&2
            exit 1
          fi
          if [ "$HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Artifact head-sha does not match the verified Producer Run Head SHA" >&2
            exit 1
          fi

          # Experiment safety allowlist (target-shape only), not the policy: the
          # authorization decision is made in the next step from trusted fields.
          case "$HEAD_REF" in
            ghsl-lab-allow-*) ;;
            *)
              echo "Refusing target outside the authorized experiment refs: $HEAD_REF" >&2
              exit 1
              ;;
          esac

          python3 - "$incoming/dist-meta/metadata.json" "$HEAD_REF" "$HEAD_SHA" "$PR_NUMBER" "$PRODUCER_RUN_ID" "$EXPECTED_BASE_REPOSITORY_ID" "$EXPECTED_HEAD_REPOSITORY_ID" "$EXPECTED_HEAD_BRANCH" "$EXPECTED_BASE_REF" "$EXPECTED_BASE_REPOSITORY" "$EXPECTED_HEAD_REPOSITORY" "$EXPECTED_PRODUCER_RUN_ATTEMPT" "$EXPECTED_PRODUCER_WORKFLOW" <<'PY'
          import json
          import sys

          (path, head_ref, head_sha, pr_number, producer_run_id, base_id, head_id,
           head_branch, base_ref, base_repository, head_repository,
           producer_run_attempt, producer_workflow) = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              metadata = json.load(handle)
          expected = {
              "schema_version": "1.0",
              "experiment_id": "ghsl_2026_225_real_platform",
              "variant": "allow_control",
              "producer_workflow": "GHSL Lab Producer Allow",
              "producer_run_id": int(producer_run_id),
              "producer_run_attempt": int(producer_run_attempt),
              "base_repository": base_repository,
              "base_repository_id": int(base_id),
              "base_ref": base_ref,
              "head_repository": head_repository,
              "head_repository_id": int(head_id),
              "head_branch": head_branch,
              "head_sha": head_sha,
              "pr_number": int(pr_number),
              "target_branch": "refs/heads/" + head_ref,
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit("Artifact metadata mismatch for %s: %r != %r" % (key, metadata.get(key), value))
          print("GHSL_ARTIFACT_METADATA=MATCH")
          PY

          ARTIFACTS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID/artifacts?per_page=100")"
          ARTIFACT_ID="$(printf '%s' "$ARTIFACTS_JSON" | jq -r '[.artifacts[] | select(.name == "rebuilt-dist" and .expired == false) | .id] | if length == 1 then .[0] else empty end')"
          if [ -z "$ARTIFACT_ID" ]; then
            echo "Expected exactly one live rebuilt-dist Artifact for the Producer Run" >&2
            exit 1
          fi
          echo "artifact-id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "GHSL_ARTIFACT_ID=$ARTIFACT_ID"
          echo "head-ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Apply the same-repository PR branch write-back policy
        id: policy
        env:
          BASE_REPOSITORY_ID: "1450391213"
          HEAD_REPOSITORY_ID: ${{ github.event.workflow_run.head_repository.id }}
          PR_HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          TARGET_REF: refs/heads/${{ steps.metadata.outputs.head-ref }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr-number }}
          HEAD_SHA: ${{ steps.identity.outputs.head-sha }}
          CONSUMER_RUN_ID: ${{ github.run_id }}
          CONSUMER_JOB_ID: ${{ job.check_run_id }}
          ARTIFACT_ID: ${{ steps.metadata.outputs.artifact-id }}
          IDENTITY_CHECKS: ${{ steps.identity.outputs.identity-checks }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/ghsl-allow-evidence"
          mkdir -p "$evidence"

          decision=REJECT
          reason="unclassified"
          if [ "$HEAD_REPOSITORY_ID" = "$BASE_REPOSITORY_ID" ]; then
            if [ "$TARGET_REF" = "refs/heads/$PR_HEAD_REF" ]; then
              decision=ALLOW
              reason="same-repository PR and the Artifact target equals the trusted PR head ref"
            else
              reason="Artifact target $TARGET_REF is not the authorized PR head ref"
            fi
          else
            reason="head repository is not the Base repository; the authorized write-back set is empty"
          fi
          if [ "$TARGET_REF" = "refs/heads/main" ]; then
            decision=REJECT
            reason="refusing the default branch as a write-back target"
          fi

          python3 - "$evidence/decision.json" "$decision" "$reason" "$BASE_REPOSITORY_ID" "$HEAD_REPOSITORY_ID" "$PR_HEAD_REF" "$TARGET_REF" "$PRODUCER_RUN_ID" "$PR_NUMBER" "$HEAD_SHA" "$CONSUMER_RUN_ID" "$CONSUMER_JOB_ID" "$ARTIFACT_ID" "$IDENTITY_CHECKS" <<'PY'
          import datetime
          import json
          import sys

          (path, decision, reason, base_id, head_id, pr_head_ref, target_ref,
           producer_run_id, pr_number, head_sha, consumer_run_id, consumer_job_id,
           artifact_id, identity_checks) = sys.argv[1:]
          checks = [
              {"field": "head_repository_id == base_repository_id",
               "trusted": int(base_id), "compared": int(head_id),
               "result": "MATCH" if base_id == head_id else "MISMATCH"},
              {"field": "artifact_target_ref == trusted PR head ref",
               "trusted": "refs/heads/" + pr_head_ref, "compared": target_ref,
               "result": "MATCH" if target_ref == "refs/heads/" + pr_head_ref else "MISMATCH"},
              {"field": "target_ref != default branch",
               "trusted": "refs/heads/main", "compared": target_ref,
               "result": "MATCH" if target_ref != "refs/heads/main" else "MISMATCH"},
              {"field": "artifact head_sha == trusted PR head sha",
               "trusted": head_sha, "compared": head_sha, "result": "MATCH"},
          ]
          record = {
              "policy": "same_repository_pr_branch_write_back_v1_allow_case",
              "decision": decision,
              "reason": reason,
              "base_repository_id": int(base_id),
              "head_repository_id": int(head_id),
              "trusted_pr_head_ref": pr_head_ref,
              "artifact_target_ref": target_ref,
              "trusted_head_sha": head_sha,
              "producer_run_id": int(producer_run_id),
              "pull_request_number": int(pr_number),
              "consumer_run_id": int(consumer_run_id),
              "consumer_job_id": int(consumer_job_id),
              "artifact_id": int(artifact_id),
              "policy_checks": checks,
              "identity_checks": json.loads(identity_checks) if identity_checks else [],
              "sink_executed_in_this_job": False,
              "decided_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
          }
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(record, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(json.dumps({"decision": decision, "reason": reason,
                            "checks": record["policy_checks"]}, sort_keys=True))
          PY

          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "GHSL_ALLOW_POLICY_DECISION=$decision"
          echo "GHSL_ALLOW_POLICY_REASON=$reason"

      - name: Upload the ALLOW decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghsl-allow-decision-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/ghsl-allow-evidence
          if-no-files-found: warn
          retention-days: 30

  write-back:
    name: Perform the authorized fast-forward write-back
    needs: bind
    if: needs.bind.outputs.decision == 'ALLOW'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: read

    steps:
      - name: Write the authorized ref with the runner token
        id: sink
        env:
          PUSH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ needs.bind.outputs.target-branch }}
          HEAD_SHA: ${{ needs.bind.outputs.head-sha }}
          PR_NUMBER: ${{ needs.bind.outputs.pr-number }}
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
          CONSUMER_RUN_ID: ${{ github.run_id }}
          CONSUMER_JOB_ID: ${{ job.check_run_id }}
          ARTIFACT_ID: ${{ needs.bind.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/ghsl-allow-write"
          mkdir -p "$evidence"

          if ! printf '%s' "$HEAD_REF" | grep -Eq '^ghsl-lab-allow-[A-Za-z0-9._-]+$'; then
            echo "Refusing a target outside the experiment branch prefix" >&2
            exit 1
          fi

          gh api "repos/$BASE_REPOSITORY/git/ref/heads/$HEAD_REF" > "$evidence/ref_before.json"
          BEFORE_SHA="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["object"]["sha"])' "$evidence/ref_before.json")"
          echo "GHSL_REF_BEFORE_SHA=$BEFORE_SHA"
          # The push below must be a pure fast-forward from the trusted head
          # commit; anything else is refused instead of overwritten.
          if [ "$BEFORE_SHA" != "$HEAD_SHA" ]; then
            echo "Target ref is not at the trusted head commit; refusing (no force, no overwrite)" >&2
            exit 1
          fi

          # Checkout-independent commit construction: the head tree is read into
          # an index only and one experiment file is added.  Nothing checked out
          # is executed.  For a same-repository PR the head commit is on origin.
          workdir="$RUNNER_TEMP/ghsl-git-object-store"
          index_file="$RUNNER_TEMP/ghsl-allow-index"
          mkdir -p "$workdir"
          git init "$workdir"
          export GIT_DIR="$workdir/.git"
          export GIT_INDEX_FILE="$index_file"

          git remote add origin "https://github.com/$BASE_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"
          git read-tree "$HEAD_SHA^{tree}"

          blob="$(printf 'GHSL-2026-225 real platform experiment: authorized same-repository write-back\nproducer_run_id=%s\nconsumer_run_id=%s\nartifact_id=%s\npull_request=%s\n' \
            "$PRODUCER_RUN_ID" "$CONSUMER_RUN_ID" "$ARTIFACT_ID" "$PR_NUMBER" | \
            git hash-object -w --stdin)"
          git update-index --add --cacheinfo "100644,$blob,ghsl-lab/allow-output/WRITE_BACK.json"
          tree_sha="$(git write-tree)"
          new_commit="$(printf '%s\n' "GHSL lab: authorized write-back control (producer $PRODUCER_RUN_ID)" | \
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit-tree "$tree_sha" -p "$HEAD_SHA")"

          cat > "$RUNNER_TEMP/ghsl-allow-askpass.sh" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$PUSH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$RUNNER_TEMP/ghsl-allow-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/ghsl-allow-askpass.sh"
          export GIT_TERMINAL_PROMPT=0

          # Fixed remote, explicit RefSpec, no --force, no --mirror, never main.
          git push origin "$new_commit:refs/heads/$HEAD_REF" 2>&1 | tee "$evidence/push_output.txt"
          remote_sha="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
          if [ "$remote_sha" != "$new_commit" ]; then
            echo "Remote Ref SHA verification failed" >&2
            exit 1
          fi

          gh api "repos/$BASE_REPOSITORY/git/ref/heads/$HEAD_REF" > "$evidence/ref_after.json"
          AFTER_SHA="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["object"]["sha"])' "$evidence/ref_after.json")"
          if [ "$AFTER_SHA" != "$new_commit" ]; then
            echo "Post-write Ref SHA does not equal the pushed commit" >&2
            exit 1
          fi

          gh api "repos/$BASE_REPOSITORY/pulls/$PR_NUMBER" > "$evidence/pr_after.json"
          git -C "$workdir" cat-file -p "$new_commit" > "$evidence/new_commit_object.txt" || true

          echo "GHSL_REF_WRITE=SUCCESS"
          echo "GHSL_SINK_PERMISSIONS=contents:write"
          echo "GHSL_ALLOW_SINK_EXECUTED=true"
          echo "GHSL_CONSUMER_RUN_ID=${{ github.run_id }}"
          echo "GHSL_CONSUMER_JOB_ID=$CONSUMER_JOB_ID"
          echo "GHSL_ARTIFACT_ID=$ARTIFACT_ID"
          echo "producer_run_id=$PRODUCER_RUN_ID"
          echo "pull_request_number=$PR_NUMBER"
          echo "trusted_head_sha=$HEAD_SHA"
          echo "consumer_commit_sha=$new_commit"
          echo "written_ref=refs/heads/$HEAD_REF"
          echo "verified_remote_ref_sha=$remote_sha"
          echo "new-commit=$new_commit" >> "$GITHUB_OUTPUT"

      - name: Upload the ALLOW write evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghsl-allow-write-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/ghsl-allow-write
          if-no-files-found: warn
          retention-days: 30
